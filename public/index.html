<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de Clases</title><link rel="stylesheet" href="style.css"></head><body><header><b>GESTOR DE CLASES</b><span id="session"></span></header><main><section id="auth" class="panel"><h2>Acceso</h2><div><button onclick="showLogin()">Iniciar sesión</button> <button onclick="showRegister()">Crear cuenta</button></div><form id="login"><input id="le" type="email" placeholder="Email" required><input id="lp" type="password" placeholder="Contraseña" required><button>Entrar</button></form><form id="register" class="hidden"><input id="rn" placeholder="Nombre" required><input id="rp" placeholder="Teléfono"><input id="re" type="email" placeholder="Email" required><input id="rpass" type="password" placeholder="Contraseña" required><button>Registrarme</button></form></section><section id="app" class="hidden"><div class="top"><div><h1>Clases disponibles</h1><p>Reserva tu plaza.</p></div><button onclick="logout()">Cerrar sesión</button></div><div id="classes" class="grid"></div><section class="panel"><h2>Mis reservas</h2><div id="mine"></div></section><section id="admin" class="hidden"><div class="panel"><h2>Panel administrador</h2><div id="stats" class="stats"></div><h3>Añadir clase</h3><form id="newClass" class="formgrid"><input id="ct" placeholder="Nombre" required><input id="cd" type="date" required><input id="cime" type="time" required><input id="cc" type="number" min="1" placeholder="Plazas" required><input id="cp" type="number" min="0" step=".01" placeholder="Precio" required><button>Añadir</button></form><h3>Reservas y pagos</h3><div id="allBookings"></div></div></section></section></main><div id="toast"></div><script src="app.js"></script></body></html>
